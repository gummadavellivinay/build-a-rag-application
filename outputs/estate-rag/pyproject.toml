[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "estate-rag"
version = "0.1.0"
description = "Hybrid, OCR multilingual, and graph-assisted real estate RAG"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1.0,<2", "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2", "langchain-text-splitters>=1.0,<2",
  "pinecone>=7,<9", "rank-bm25>=0.2.2,<0.3", "networkx>=3.4,<4",
  "pydantic-settings>=2.7,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "pymupdf>=1.25,<2", "pytesseract>=0.3.13,<0.4",
  "pillow>=11,<13", "python-docx>=1.1,<2", "tenacity>=9,<10",
  "tiktoken>=0.9,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
estate-rag = "estate_rag.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
